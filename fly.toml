# fly.toml app configuration file generated for nexcommerce on 2026-01-14T16:17:57-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexcommerce'
primary_region = 'iad'

[build]

[deploy]
  # No release command needed for PocketBase

[mounts]
  source = 'pb_data'
  destination = '/pb/pb_data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
